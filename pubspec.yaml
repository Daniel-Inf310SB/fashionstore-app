name: fashionstore

description: "FashionStore mobile application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^2.6.1
  http: ^1.6.0
  flutter_secure_storage: 9.2.4
  device_info_plus: ^12.4.0
  uuid: ^4.6.0
  camera: ^0.12.0+2
  google_mlkit_pose_detection: ^0.16.1
  google_mlkit_commons: ^0.13.0
  hand_landmarker: ^3.0.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  flutter_stripe: ^14.0.0
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  http_parser: ^4.1.2
  speech_to_text: ^7.5.0
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21